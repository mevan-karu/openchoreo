   ================================================================== */

/* Reproduces eventJSON exactly — same field order, same omitempty rules.
   Three details a hand-written mock gets wrong unless it follows the tags:

   - `action` and `category` carry NO omitempty, so an event that resolved no
     operation publishes them as empty strings, not as absent keys.
   - `resource` carries no omitempty either and is a pointer, so a non-resource
     event publishes "resource": null rather than dropping the key.
   - inside resource, Hierarchy's project/component/resource sit as flat
     siblings after namespace, and namespace itself is the hierarchy's unless
     Resource.Namespace is non-empty.

   There is no audit_id: it would be 1:1 with event_id until an operation
   emits more than one record, so it lands with the pre-action event that
   gives it something to group. producer_instance is likewise not emitted. */
function wireShape(e) {
  const r = e.resource;
  const hasResource = r.type || r.namespace || r.environment || r.project || r.component || r.resource || r.uid || r.name;

  // resourceJSON's own published order: type, namespace, environment,
  // project, component, resource, uid, name, metadata.
  let resource;
  if (hasResource) {
    resource = {};
    if (r.type) resource.type = r.type;
    if (r.namespace) resource.namespace = r.namespace;
    if (r.environment) resource.environment = r.environment;
    if (r.project) resource.project = r.project;
    if (r.component) resource.component = r.component;
    if (r.resource) resource.resource = r.resource;
    if (r.uid) resource.uid = r.uid;
    if (r.name) resource.name = r.name;
  }

  const actor = { type: e.actor.type, id: e.actor.id };
  if (e.actor.type !== 'anonymous') actor.issuer = ISSUER;
  if (e.session_id) actor.session_id = e.session_id;
  if (e.actor.ents) actor.entitlements = e.actor.ents;

  const o = {
    schema_version: SCHEMA_VERSION,
    event_id: e.event_id,
    event_time: e.event_time.toISOString(),
    actor,
    // action and category carry no omitempty, so a rejection that resolved
    // no operation publishes them as empty strings rather than omitting them.
    action: e.action || '',
    category: e.category || '',
    result: e.result,
    request_id: e.request_id,
    source_ip: e.source_ip || '',
    user_agent: e.user_agent || '',
    producer: e.producer,
  };
  if (e.surface) o.surface = e.surface;
  if (e.operation_id) o.operation_id = e.operation_id;
  if (e.http) o.http = { method: e.http.method, path: e.http.path };
  // resource IS omitempty in v1 — omitted entirely, not published as null,
  // when nothing resource-shaped was resolved.
  if (resource) o.resource = resource;
  return o;
}

function highlightJSON(obj) {
  return esc(JSON.stringify(obj, null, 2))
    .replace(/"([^"\\]*)":/g, '<span class="j-k">"$1"</span>:')
    .replace(/: "([^"\\]*)"/g, ': <span class="j-s">"$1"</span>')
    .replace(/: (\d+|true|false|null)/g, ': <span class="j-n">$1</span>');
}

/* A value in the drawer that filters the list to itself — the fastest path
   from "this looks odd" to "show me everything like it". */
function drill(attr, value) {
  return el('button', {
    class: 'drill', type: 'button', text: value,
    title: `Filter by ${attr}:${value}`,
    onclick: () => { addToken(attr, value); S.selected = null; render(); },
  });
}

/* Entitlements are map[string][]string — keyed by claim name. ExtractActor
   builds exactly one key today, but the type allows more, so render every
   claim rather than assuming the first. Naming the claim matters: "developer"
   means nothing without knowing it came from `groups`. */
function entitlementsCell(ents) {
  const wrap = el('span', {});
  Object.entries(ents).forEach(([claim, vals], ci) => {
    if (ci) wrap.append(el('span', { class: 'hint', style: 'margin-bottom:4px' }));
    vals.forEach((v, i) => {
      if (i) wrap.append(document.createTextNode(', '));
      wrap.append(drill('actor.entitlements.' + claim, v));
    });
    wrap.append(el('span', { class: 'hint', text: `from the ${claim} claim` }));
  });
  return wrap;
}

function kv(pairs) {
  const dl = el('dl', { class: 'kv' });
  for (const [k, v, opts] of pairs) {
    if (v === undefined) continue;
    dl.append(el('dt', { text: k }));
    const dd = el('dd', { class: (opts && opts.mono) ? 'mono' : '' });
    if (v === null) dd.append(el('span', { class: 'absent', text: (opts && opts.absent) || 'not recorded' }));
    else dd.append(typeof v === 'string' ? document.createTextNode(v) : v);
    if (opts && opts.hint) dd.append(el('span', { class: 'hint', text: opts.hint }));
    dl.append(dd);
  }
  return dl;
}

function renderDrawer() {
  const scrim = document.getElementById('scrim');
  const dr = document.getElementById('drawer');
  const e = EVENTS.find(x => x.event_id === S.selected);
  if (!e) { scrim.classList.remove('open'); dr.classList.remove('open'); dr.replaceChildren(); return; }

  scrim.classList.add('open');
  scrim.onclick = () => { S.selected = null; render(); };
  dr.classList.add('open');
  dr.replaceChildren();
  const close = () => { S.selected = null; render(); };

  dr.append(el('div', { class: 'dr-head' },
    el('div', { class: 'dr-eyebrow' }, 'Audit event', el('span', { class: 'grow' }),
      el('button', { class: 'dr-x', type: 'button', 'aria-label': 'Close', html: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>', onclick: close })),
    el('div', { class: 'dr-title', id: 'dr-title', text: e.action || 'authentication rejected' }),
    el('div', { class: 'dr-meta' },
      el('span', { class: 'pill ' + e.result, text: e.result }),
      el('span', { class: 'surface ' + e.surface }, el('span', { class: 'o-dot' }), e.surface === 'mcp' ? 'via MCP' : 'via the REST API'),
      el('span', { class: 't-rel', text: `${e.event_time.toLocaleString([], { hour12: false })} · ${relTime(e.event_time)}` }),
    ),
  ));

  const body = el('div', { class: 'dr-body' });

  if (e.result === 'unauthenticated') {
    body.append(el('div', { class: 'dr-sec' },
      el('div', { class: 'related' },
        el('span', { html: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3l8 3v6c0 4.4-3.2 7.9-8 9-4.8-1.1-8-4.6-8-9V6z"/><path d="M12 9v3M12 15h.01"/></svg>' }),
        el('span', {}, el('b', { text: 'Refused at the boundary.' }),
          ' The token never resolved to an operation, so no action, category, operation or resource was recorded — and no reason for the rejection either. Note the published event carries action and category as empty strings rather than omitting them, and resource as null. What is here is the time, surface, request ID, source IP and user agent. OpenChoreo does not observe sign-in, so match this against your identity provider\'s own records.'),
      )));
  }

  body.append(el('div', { class: 'dr-sec' },
    el('h4', { text: 'Who' }),
    kv([
      ['Actor', drill('actor.id', e.actor.id), { mono: true, hint: 'the token’s validated sub claim — unique only within the issuer' }],
      ['Type', drill('actor.type', e.actor.type)],
      ['Issuer', e.actor.type === 'anonymous' ? null : drill('actor.issuer', ISSUER), { mono: true, absent: 'no validated token' }],
      ['Session', e.session_id ? drill('actor.session_id', e.session_id) : null,
        { mono: true, hint: e.session_id ? 'the sid claim — match this against the IdP’s login record' : undefined,
          absent: 'no sid claim — OIDC leaves it optional, and client-credentials tokens carry none' }],
      ['Entitlements', e.actor.ents ? entitlementsCell(e.actor.ents) : null,
        { absent: 'no entitlement claim on the token' }],
    ]),
  ));

  body.append(el('div', { class: 'dr-sec' },
    el('h4', { text: 'What' }),
    kv([
      ['Action', e.action ? drill('action', e.action) : null, { mono: true, absent: 'empty string — no operation resolved' }],
      ['Category', e.category ? drill('category', e.category) : null, { absent: 'empty string — no operation resolved' }],
      ['Operation ID', e.operation_id ? drill('operation_id', e.operation_id) : null, { mono: true, absent: 'none' }],
      ['Surface', drill('surface', e.surface), { mono: true, hint: e.surface === 'mcp' ? 'MCP wraps the REST API, so the action is audited once, here. The tool name itself is not recorded.' : undefined }],
      ['Request line', e.http ? el('span', {}, drill('http.method', e.http.method), document.createTextNode(' '), drill('http.path', e.http.path)) : null,
        { mono: true, absent: 'none — an MCP tools/call has no request line of its own' }],
      ['Outcome', el('span', { class: 'pill ' + e.result, text: e.result }), { hint: RESULTS.find(r => r.id === e.result).note }],
    ]),
  ));

  if (e.resource.type) {
    const path = el('div', { class: 'path' });
    const segs = e.resource.namespace ? [['namespace', e.resource.namespace]] : [['scope', 'cluster']];
    if (e.resource.project) segs.push(['project', e.resource.project]);
    if (e.resource.component) segs.push(['component', e.resource.component]);
    if (e.resource.resource) segs.push(['resource', e.resource.resource]);
    segs.forEach((s, i) => {
      if (i) path.append(el('span', { class: 'arrow', text: '/' }));
      path.append(el('span', { class: 'path-seg' }, el('span', { class: 'k', text: s[0] }), el('span', { class: 'v', text: s[1] })));
    });
    body.append(el('div', { class: 'dr-sec' },
      el('h4', { text: 'Where' }),
      path,
      el('div', { style: 'height:6px' }),
      el('div', { class: 'res-type', style: 'margin-bottom:12px', text: 'Hierarchy the authorization decision was made on — recorded before the policy engine evaluates, so a denial carries it too.' }),
      kv([
        ['Resource type', drill('resource.type', e.resource.type), { mono: true }],
        ['Environment', e.resource.environment ? drill('resource.environment', e.resource.environment) : undefined,
          { mono: true, hint: 'namespace-qualified, and not a hierarchy level — it comes from the ABAC attributes a CEL condition evaluates against' }],
        ['Name', drill('resource.name', e.resource.name), { mono: true }],
        ['Resource UID', e.resource.uid ? drill('resource.uid', e.resource.uid) : null, { mono: true, hint: 'server-generated and never reused, so a delete-then-recreate is distinguishable from an update', absent: 'none — the operation returned no object' }],
      ]),
    ));
  }

  body.append(el('div', { class: 'dr-sec' },
    el('h4', { text: 'Correlation' }),
    kv([
      ['Event ID', e.event_id, { mono: true, hint: 'UUID v7, so it sorts by creation time. One record per operation today — a grouping id arrives with the pre-action event.' }],
      ['Request ID', drill('request_id', e.request_id), { mono: true, hint: 'joins this event to the access log; validated as a UUID, or regenerated' }],
      ['Client', e.user_agent ? el('span', {}, drill('user_agent', e.user_agent),
        el('span', { class: 'hint', text: 'client-supplied, so it is a claim rather than proof' })) : null,
        { mono: true, absent: 'no User-Agent header sent' }],
      ['Source IP', e.source_ip ? drill('source_ip', e.source_ip) : null, { mono: true, absent: e.surface === 'mcp' ? 'unavailable for a direct MCP client — no RemoteAddr, and no forwarding headers set' : 'not recorded' }],
      ['Producer', drill('producer', e.producer), { mono: true }],
      ['Schema version', drill('schema_version', SCHEMA_VERSION), { mono: true, hint: 'major on a removal or a changed representation, minor on an addition' }],
    ]),
  ));

  const copyBtn = el('button', { class: 'btn tiny', type: 'button', text: 'Copy' });
  copyBtn.addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(JSON.stringify(wireShape(e), null, 2)); copyBtn.textContent = 'Copied'; }
    catch { copyBtn.textContent = 'Press ⌘C'; }
    setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1600);
  });
  body.append(el('div', { class: 'dr-sec' },
    el('div', { class: 'sec-head-row' }, el('h4', { text: 'Event as published' }), copyBtn),
    el('pre', { class: 'dr-json', html: highlightJSON(wireShape(e)) }),
  ));

  dr.append(body);
}

/* ==================================================================
   Live tail
   ================================================================== */

/* A newly arrived event can carry a value no seeded event had, so fold it into
   the discovered facet lists — otherwise the suggestion counts drift away from
   what the table is showing. */
function indexEvent(ev) {
  for (const p of FIELD_PATHS) {
    const v = valueAt(ev, p);
    if (v === null || v === undefined) continue;
    const known = FIELD_VALUES.get(p);
    if (!known) continue;
    for (const one of (Array.isArray(v) ? v : [v])) {
      if (typeof one === 'object') continue;
      if (!known.includes(one)) { known.push(one); known.sort(); }
    }
  }
}

const LIVE_INTERVAL_MS = 2500;
const LIVE_BACKLOG_CAP = 900;
let liveTimer = null;

function liveTick() {
  CLOCK = new Date(CLOCK.getTime() + 2000 + Math.floor(rnd() * 5000));
  const arriving = 1 + (rnd() < 0.35 ? 1 : 0);
  for (let i = 0; i < arriving; i++) {
    const roll = rnd();
    const ev = roll < 0.08 ? unauthEvent(CLOCK.getTime())
      : roll < 0.15 ? observerEvent(CLOCK.getTime())
      : newEvent(CLOCK.getTime());
    EVENTS.unshift(ev);
    indexEvent(ev);
  }
  // EVENTS is newest-first, so trimming the tail drops the oldest.
  if (EVENTS.length > LIVE_BACKLOG_CAP) EVENTS.length = LIVE_BACKLOG_CAP;
  S.loadedAt = new Date(CLOCK);
  render();
}

function setLive(on) {
  S.isLive = on;
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
  // Zooming pins the window to a past slice, so tailing into it would be a lie.
  if (on) { S.zoom = null; liveTimer = setInterval(liveTick, LIVE_INTERVAL_MS); }
  render();
}

/* ==================================================================
   Results toolbar
   ================================================================== */

function renderToolbar(rows) {
  const box = document.getElementById('rtbar-actions');
  box.replaceChildren();

  const desc = S.sort === 'desc';
  // The arrow flips with the order, as LogsActions does — the label alone
  // changing too little to register as a state change.
  const arrow = desc
    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4M6 10l6-6 6 6"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v16M6 14l6 6 6-6"/></svg>';
  box.append(el('button', {
    class: 'btn tiny', type: 'button',
    title: desc ? 'Sort events by Newest First' : 'Sort events by Oldest First',
    onclick: () => { S.sort = desc ? 'asc' : 'desc'; S.page = 1; render(); },
  }, el('span', { class: 'btn-ico', html: arrow }), desc ? 'Newest First' : 'Oldest First'));

  box.append(el('button', {
    class: 'btn tiny' + (S.isLive ? ' is-live' : ''), type: 'button',
    'aria-pressed': S.isLive ? 'true' : 'false',
    title: S.isLive ? 'Stop Live Updates' : 'Start Live Updates',
    onclick: () => setLive(!S.isLive),
  }, el('span', { class: 'live-dot' + (S.isLive ? ' on' : '') }), 'Live'));

  box.append(el('button', {
    class: 'btn tiny', type: 'button', title: 'Refresh',
    onclick: () => { S.loadedAt = new Date(CLOCK); render(); },
  }, el('span', { class: 'btn-ico', html: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>' }), 'Refresh'));

  // Phrased as the runtime-logs stats row is: "Total logs: N" /
  // "Last updated at: <date>".
  const w = activeWindow();
  document.getElementById('result-count').replaceChildren(
    document.createTextNode('Total events: '),
    el('b', { text: rows.length.toLocaleString() }),
    document.createTextNode(` · ${fmtRange(w.from, w.to)}`),
  );
  document.getElementById('result-updated').textContent =
    `Last updated at: ${S.loadedAt.toLocaleString([], { hour12: false })}`;
}

/* ==================================================================
   Render
   ================================================================== */

function render() {
  const rows = filtered();
  rows.sort((a, b) => S.sort === 'desc' ? b.event_time - a.event_time : a.event_time - b.event_time);
  renderQueryBar();
  renderRangeField();
  renderColumnsField();
  renderLenses();
  renderTimeline(rows);
  renderToolbar(rows);
  renderTable(rows);
  renderDrawer();
}

/* In the chart-less build, take the timeline out of the document rather than
   hiding it — a display:none chart is still a chart in the markup. */
if (!CHART_ENABLED) {
  for (const id of ['tl-head', 'tl-body', 'chart-toggle']) {
    document.getElementById(id)?.remove();
  }
}

render();

</script>
